colors:
  # public/css/style.css :root is the light "Light Rustic" theme and the only copy of these values
  # (repo CLAUDE.md, Theming). The golds are the repo's darkened pair; the live styles row still lays
  # the gallery golds (#a9721f/#c98a2b) over guest pages until commit 424cfcd is pushed. Repo wins.
  palette:
    bg:            {value: "#f6ecd8", source: "public/css/style.css:21", status: extracted}
    bg-panel:      {value: "#fffaf0", source: "public/css/style.css:22", status: extracted}
    bg-panel-2:    {value: "#efdfc0", source: "public/css/style.css:23", status: extracted}
    line:          {value: "#d8c39d", source: "public/css/style.css:24", status: extracted}
    gold:          {value: "#87590f", source: "public/css/style.css:31 (text-safe gold)", status: extracted}
    gold-bright:   {value: "#a9721f", source: "public/css/style.css:32 (decoration, 24px+ only)", status: extracted}
    rust:          {value: "#8c3a2b", source: "public/css/style.css:33; favicon.svg ground; RV PARK in the lockup; primary buttons", status: extracted}
    rust-bright:   {value: "#a8462f", source: "public/css/style.css:34", status: extracted}
    cedar:         {value: "#55643f", source: "public/css/style.css:35", status: extracted}
    cedar-light:   {value: "#74895a", source: "public/css/style.css:36", status: extracted}
    parchment:     {value: "#3c2a1a", source: "public/css/style.css:37 (body text)", status: extracted}
    parchment-dim: {value: "#6b5844", source: "public/css/style.css:38 (secondary text)", status: extracted}
    ink:           {value: "#2b1d10", source: "public/css/style.css:40", status: extracted}
    btn-text:      {value: "#f7ecd8", source: "public/css/style.css:44 (text on rust fills)", status: extracted}
    hero-sky:      {value: "#f3d9a8", source: "public/css/style.css:51", status: extracted}
    hero-sun:      {value: "#e8a23a", source: "public/css/style.css:52", status: extracted}
    theme-color:   {value: "#f6ecd8", source: "public/index.html:10 meta theme-color", status: extracted}
  roles:
    paper:      {palette: bg,            value: "#f6ecd8", status: inferred}
    ink:        {palette: ink,           value: "#2b1d10", status: inferred, contrast: 13.93}
    # Rust is the mark's colour: the favicon ground, RV PARK in every lockup, the Book-now CTA and
    # primary buttons, the office building itself. Gold is the site's eyebrow/link colour and is
    # recorded as the secondary. Flip these two at review if the park prefers gold pieces.
    accent:     {palette: rust,          value: "#8c3a2b", status: inferred, contrast: 6.50}
    accent-ink: {palette: rust,          value: "#8c3a2b", status: inferred, contrast: 6.50}   # rust itself passes 4.5:1 on paper
    muted:      {palette: parchment-dim, value: "#6b5844", status: inferred, contrast: 5.77}
    secondary:  {palette: gold,          value: "#87590f", status: inferred, contrast: 5.17}
    # Reverse face. Rust on ink measures 2.14:1 (fails the 3:1 bar), so per the skill rule the reverse
    # face uses the accent as its paper: rust panels with the site's own btn-text cream, exactly the
    # favicon and the primary buttons. Graphics and small accent text on rust take hero-sky, the
    # palette's warm sand, at 5.55:1 (gold-bright on rust is 1.86:1 and is never used there).
    reverse-paper:      {palette: rust,     value: "#8c3a2b", status: inferred}
    reverse-ink:        {palette: btn-text, value: "#f7ecd8", status: inferred, contrast: 6.51}
    reverse-accent:     {palette: hero-sky, value: "#f3d9a8", status: inferred, contrast: 5.55}
    reverse-accent-ink: {palette: hero-sky, value: "#f3d9a8", status: inferred, contrast: 5.55}
    measured: "node scripts/contrast.mjs 2026-09-25: ink/paper 13.93, rust/paper 6.50, gold/paper 5.17, gold-bright/paper 3.50, parchment-dim/paper 5.77, rust/ink 2.14, gold-bright/ink 3.98, btn-text/rust 6.51, hero-sky/rust 5.55, gold-bright/rust 1.86"

