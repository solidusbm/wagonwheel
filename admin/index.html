<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wagon Wheel RV Park — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  body{padding:0 0 60px;}
  .admin-wrap{max-width:1080px; margin:0 auto; padding:32px 24px;}
  .admin-wrap h1{font-size:26px; margin:0 0 4px;}
  .admin-sub{color:var(--parchment-dim); font-size:13px; margin:0 0 24px; font-style:italic;}
  .admin-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  table{width:100%; border-collapse:collapse; background:var(--bg-panel); border:1px solid rgba(232,220,196,0.1); border-radius:var(--radius); overflow:hidden;}
  th, td{text-align:left; padding:10px 14px; font-size:13px; border-bottom:1px solid rgba(232,220,196,0.08); vertical-align:top;}
  th{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); background:var(--bg-panel-2);}
  tr:last-child td{border-bottom:none;}
  .status-pill{font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; padding:3px 9px; border-radius:999px;}
  .status-pill.confirmed{background:rgba(107,122,84,0.25); color:var(--cedar-light);}
  .status-pill.pending{background:rgba(201,138,43,0.2); color:var(--gold-bright);}
  .status-pill.cancelled{background:rgba(140,58,43,0.25); color:var(--rust-bright);}
  .empty-note, .error-msg{color:var(--parchment-dim); font-style:italic; padding:20px 0;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .row-actions button{font-size:10.5px; padding:6px 10px;}
  #booking-panel{display:none;}
  #booking-panel.open{display:block;}
  #admin-form-error{margin:0 0 14px;}
</style>
</head>
<body>
<div class="admin-wrap">
  <h1>Reservations</h1>
  <p class="admin-sub">Upcoming and pending bookings, sorted by check-in date.</p>

  <div class="admin-toolbar">
    <button type="button" class="btn btn-primary" id="new-booking-btn">+ New booking</button>
  </div>

  <div class="panel" id="booking-panel">
    <h2 id="booking-panel-title">New booking</h2>
    <div class="sub">Phone-ins, walk-ins, and manual corrections. No card is charged here.</div>
    <form id="admin-booking-form">
      <input type="hidden" id="f-code" value="" />
      <div class="grid-2">
        <div class="field">
          <label for="f-site">Site</label>
          <select id="f-site" required></select>
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="confirmed">Confirmed</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="f-checkin">Check-in</label><input type="date" id="f-checkin" required /></div>
        <div class="field"><label for="f-checkout">Check-out</label><input type="date" id="f-checkout" required /></div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="f-name">Guest name</label><input type="text" id="f-name" required /></div>
        <div class="field"><label for="f-email">Guest email</label><input type="email" id="f-email" required /></div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" /></div>
        <div class="field"><label for="f-guests">Guests</label><input type="number" id="f-guests" min="1" max="8" value="2" /></div>
      </div>
      <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" rows="2"></textarea></div>
      <p id="admin-form-error" class="error-msg" hidden></p>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="cancel-form-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-booking-btn">Save booking</button>
      </div>
    </form>
  </div>

  <div id="admin-content">Loading…</div>
</div>
<script type="module" src="/admin/js/admin.js"></script>
</body>
</html>
