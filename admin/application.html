<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guest application — Wagon Wheel RV Park</title>
<link rel="stylesheet" href="/css/fonts.css" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  /* A sheet of paper on screen, and a sheet of paper on paper. Every field in the application is
     printed whether or not it holds a value -- an empty one prints as a rule to write on, which is
     the whole point: the office takes this to the guest and fills in what the booking form didn't
     ask for (a co-applicant's licence state, say) or what the guest skipped. */
  body{background:#e7e2d6; padding:0; margin:0;}
  .sheet{
    max-width:8.27in; margin:24px auto; background:#fff; color:#2b1d10;
    padding:0.6in 0.7in; box-shadow:0 2px 18px rgba(0,0,0,0.18);
    font-family:'Zilla Slab',Georgia,serif; font-size:12.5px; line-height:1.5;
  }
  .toolbar{max-width:8.27in; margin:20px auto 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .toolbar .spacer{flex:1;}
  .toolbar a, .toolbar button{font-family:'JetBrains Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; cursor:pointer;}

  .sheet h1{font-family:'Rye',serif; font-size:21px; margin:0; color:#2b1d10; letter-spacing:0;}
  .park-line{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#6b5844; margin:3px 0 0;}
  .doc-title{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; margin:16px 0 0; padding-top:12px; border-top:2px solid #2b1d10;}

  .booking{display:grid; grid-template-columns:repeat(4,1fr); gap:8px 18px; margin:12px 0 4px;}
  .booking .k{font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:#6b5844;}
  .booking .v{font-size:13px; font-weight:600;}

  section{margin-top:16px; break-inside:avoid;}
  section h2{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;
             color:#2b1d10; margin:0 0 7px; padding-bottom:3px; border-bottom:1px solid #b9ac93;}
  .grid{display:flex; flex-wrap:wrap; gap:9px 16px;}
  .f{flex:1 1 168px; min-width:0;}
  .f.narrow{flex:0 1 92px;}
  .f .lab{font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:0.07em; text-transform:uppercase; color:#6b5844; display:block; margin-bottom:1px;}
  /* The value sits ON the rule, so a filled field and a blank one occupy the same space and the
     sheet doesn't reflow depending on how much the guest typed. */
  .f .val{display:block; min-height:19px; border-bottom:1px solid #8d8272; padding:1px 2px 2px;
          font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .f .val:empty::after{content:"\00a0";}
  .f .val.filled{font-weight:600;}

  .rows{display:flex; flex-direction:column; gap:9px;}
  .note{font-size:11px; font-style:italic; color:#6b5844; margin:5px 0 0;}
  .sign{display:flex; gap:26px; margin-top:22px; break-inside:avoid;}
  .sign .f{flex:1 1 auto;}
  .sign .f.date{flex:0 0 150px;}
  .err{padding:40px; text-align:center; font-style:italic; color:#8c3a2b;}

  @media print{
    /* Chrome prints backgrounds off by default; everything here is ink on white anyway. */
    body{background:#fff;}
    .toolbar{display:none;}
    .sheet{box-shadow:none; margin:0; max-width:none; padding:0.35in 0.4in; font-size:11.5px;}
    @page{size:letter portrait; margin:0.4in;}
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="/admin" class="btn btn-ghost">&larr; Back to admin</a>
  <span class="spacer"></span>
  <button type="button" class="btn btn-primary" id="print-btn">Print</button>
</div>
<div class="sheet" id="sheet"><p class="err">Loading&hellip;</p></div>
<script type="module" src="/admin/js/application-print.js"></script>
</body>
</html>
