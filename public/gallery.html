<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photo Gallery — Bandera Wagon Wheel RV Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .full-gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; padding-bottom:16px;}
  .full-gallery figure{margin:0; background:var(--bg-panel); border:1px solid rgba(232,220,196,0.1); border-radius:var(--radius); overflow:hidden;}
  .full-gallery img{display:block; width:100%; height:200px; object-fit:cover;}
  .full-gallery figcaption{padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--parchment-dim);}
  .full-gallery figcaption b{color:var(--parchment); font-family:'Zilla Slab',serif; font-size:13px; font-weight:600;}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/">
    <svg class="brand-wheel" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="50" cy="50" r="10" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="5">
        <line x1="50" y1="4" x2="50" y2="96"/>
        <line x1="4" y1="50" x2="96" y2="50"/>
        <line x1="16.6" y1="16.6" x2="83.4" y2="83.4"/>
        <line x1="83.4" y1="16.6" x2="16.6" y2="83.4"/>
      </g>
    </svg>
    <span>Wagon Wheel RV</span>
  </a>
  <div class="links">
    <a href="/#about">About</a>
    <a href="/#amenities">Amenities</a>
    <a href="/#booking">Book now</a>
  </div>
  <a href="/#booking" class="cta">Book now</a>
</nav>

<div class="wrap">
  <section class="section-pad">
    <div class="section-head">
      <div class="eyebrow">Photo Gallery</div>
      <h2>The whole album</h2>
      <p>Every photo we've got of the park, in one place.</p>
    </div>

    <div class="full-gallery" id="full-gallery"></div>
    <p class="empty-note" id="full-gallery-empty" hidden style="color:var(--parchment-dim); font-style:italic;">No photos uploaded yet.</p>

    <div class="btn-row" style="justify-content:center; margin-top:32px;">
      <a href="/" class="btn btn-ghost">← Back home</a>
      <a href="/#booking" class="btn btn-primary">Book a site</a>
    </div>
  </section>
</div>

<footer>
  <strong>Bandera Wagon Wheel RV Park</strong> · 325 Polly Peak Dr, Bandera, TX 78003<br>
  (830) 850-0805 · banderawagonwheelrv@gmail.com
</footer>

<script>
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  fetch("/api/photos")
    .then((r) => (r.ok ? r.json() : []))
    .then((photos) => {
      if (photos.length === 0) {
        document.getElementById("full-gallery-empty").hidden = false;
        return;
      }
      const grid = document.getElementById("full-gallery");
      grid.insertAdjacentHTML(
        "beforeend",
        photos
          .map(
            (p) => `
        <figure>
          <img src="/photos/${p.id}/image" alt="${escapeHtml(p.caption ?? "Wagon Wheel RV Park photo")}" loading="lazy" />
          ${p.caption ? `<figcaption><b>${escapeHtml(p.caption)}</b></figcaption>` : ""}
        </figure>`
          )
          .join("")
      );
    })
    .catch((err) => console.error("Failed to load gallery photos", err));
</script>
</body>
</html>
