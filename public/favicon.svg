<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bandera Wagon Wheel RV Park">
  <!-- The brand's 12-spoke letterhead wheel, redrawn for a 16px tab. Strokes are much heavier
       than the in-page mark (fine rims disappear at this size), and it sits on a filled rust
       ground rather than currentColor, because a tab icon has no inherited colour to take and a
       cream wheel on rust reads against light and dark browser chrome alike. Colours are the
       stylesheet's rust (#8c3a2b) and its btn-text cream (#f7ecd8).

       Raster versions are generated from this file: node tools/make-icons.mjs -->
  <rect width="64" height="64" rx="10" fill="#8c3a2b"/>
  <g stroke="#f7ecd8" stroke-width="5" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="22" stroke-width="6"/>
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
    <line x1="13" y1="21" x2="51" y2="43"/>
    <line x1="21" y1="13" x2="43" y2="51"/>
    <line x1="43" y1="13" x2="21" y2="51"/>
    <line x1="51" y1="21" x2="13" y2="43"/>
  </g>
  <circle cx="32" cy="32" r="8" fill="#f7ecd8"/>
</svg>
