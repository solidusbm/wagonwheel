<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bandera Wagon Wheel RV Park">
  <!-- The nav's brand mark, redrawn for a 16px tab. Two departures from the version in the page:
       the strokes are much heavier (the site's 5-in-100 rim disappears entirely at this size), and
       it sits on a filled rust ground rather than being drawn in currentColor, because a tab icon
       has no inherited colour to take and a cream wheel on rust reads against light and dark
       browser chrome alike. The two colours are the stylesheet's rust (#8c3a2b) and its btn-text
       cream (#f7ecd8), which is what it already puts on any rust fill.

       Raster versions are generated from this file: node tools/make-icons.mjs -->
  <rect width="64" height="64" rx="10" fill="#8c3a2b"/>
  <g stroke="#f7ecd8" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="22"/>
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
    <line x1="16.4" y1="16.4" x2="47.6" y2="47.6"/>
    <line x1="47.6" y1="16.4" x2="16.4" y2="47.6"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#f7ecd8"/>
</svg>
